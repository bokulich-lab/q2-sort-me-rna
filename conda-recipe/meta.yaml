package:
  name: q2-sort-me-rna
  version: {{ PLUGIN_VERSION }}
source:
  path: ..
build:
  script: make install
requirements:
  host:
  - python {{ python }}
  - setuptools
  - versioningit
  - wheel
  run:
  - samtools
  - sortmerna >=7.0.0,<8.0.0a0
  - qiime2 >={{ qiime2 }}
  - q2-types >={{ q2_types }}
  build:
  - python {{ python }}
  - setuptools
  - versioningit
test:
  requires:
  - parameterized
  - pytest-xdist
  imports:
  - q2_sort_me_rna
  - qiime2.plugins.sort_me_rna
  commands:
  - pytest --pyargs q2_sort_me_rna -n 4
about:
  home: https://github.com/bokulich-lab/q2-sort-me-rna
  license: BSD-3-Clause
  license_family: BSD
